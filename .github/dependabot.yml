version: 2
updates:

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
    labels:
      - "dependencies"

  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      composer:
        applies-to: version-updates
        patterns:
          - "*"
      composer-security:
        applies-to: security-updates
        patterns:
          - "*"
    labels:
      - "dependencies"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      npm:
        applies-to: version-updates
        patterns:
          - "*"
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
    labels:
      - "dependencies"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      # serversideup rebuilds its tags in place, and no digest bump reached a PR under this cooldown.
      exclude:
        - "serversideup/php"
    # A PHP minor moves with CI's setup-php version and every extension the image compiles.
    # 8.6.0 broke the imagick build.
    ignore:
      - dependency-name: "serversideup/php"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      docker:
        applies-to: version-updates
        patterns:
          - "*"
      docker-security:
        applies-to: security-updates
        patterns:
          - "*"
    labels:
      - "dependencies"
