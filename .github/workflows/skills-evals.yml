name: Skills Evals

on:
  pull_request:
    paths:
      - '.claude/skills/**'
      - '.github/workflows/skills-evals.yml'

permissions:
  contents: read

jobs:
  business-review-skill-evals:
    runs-on: ubuntu-latest
    name: Business-review deterministic spine
    defaults:
      run:
        working-directory: .claude/skills/business-review

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Script self-tests
        run: |
          for s in classify_diff compute_tier validate_plan aggregate_verdicts sanitize_pr extract_ac promote_to_fixture check_regressions; do
            echo "== $s --test"
            python3 "scripts/$s.py" --test
          done

      - name: Fixture evals (failure-mode locks)
        run: python3 scripts/run_evals.py

      - name: Profile sanity + ledger stays out of the repo
        run: |
          python3 - <<'EOF'
          import json, pathlib
          profile = json.load(open('relaticle-profile.json'))
          assert profile['sensitive_areas'], 'profile sensitive_areas empty'
          assert profile['role_credentials'], 'profile role_credentials empty'
          # The regression ledger is machine-local (~/.claude/business-review/relaticle/)
          # because it records production incident history and this repo is public.
          # Committing it again is a leak — check_regressions.py --test covers its schema.
          assert not pathlib.Path('regressions.json').exists(), \
              'regressions.json must NOT be committed — the ledger is machine-local (see references/regression-ledger.md)'
          print('profile OK; ledger correctly absent from the repo')
          EOF
