name: CI

# The single definition of how this project is verified. Called by tests.yml on
# pull requests and pushes to main, and by deploy.yml before a release deploys.
# Both paths run the same jobs, so a hardening fix can no longer land on one and
# miss the other.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint-and-static-analysis:
    runs-on: ubuntu-latest
    name: Code Quality Checks

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache Dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.composer/cache
            vendor
          key: ${{ runner.os }}-${{ runner.arch }}-php-8.5-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-php-8.5-composer-

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          extensions: json, dom, curl, libxml, mbstring, zip, intl
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --ansi --prefer-dist --optimize-autoloader

      # PHPStan and Rector both do a full cold analysis without their result cache
      # (~22s each). The key is deliberately stable, one entry per dependency and
      # config set reused by every PR, because the PHPStan cache is ~150MB and a
      # per-commit key would churn through the repo's 10GB cache budget. Both tools
      # revalidate changed files against a restored cache, so staleness is safe.
      - name: Cache Static Analysis Results
        uses: actions/cache@v6
        with:
          path: .cache
          key: ${{ runner.os }}-static-analysis-${{ hashFiles('composer.lock', 'phpstan.neon', 'rector.php') }}
          restore-keys: |
            ${{ runner.os }}-static-analysis-

      - name: Prepare Laravel Application
        run: |
          cp .env.ci .env
          php artisan key:generate
          php artisan passport:keys --force --no-interaction

      - name: Run Lint
        run: composer test:lint

      - name: Run Refactor Check
        run: composer test:refactor

      - name: Run Static Analysis
        run: composer test:types

      # Architecture tests are not run here: tests/Arch is a testsuite in
      # phpunit.ci.xml, so the sharded `tests` job already executes all of them.

  type-coverage:
    runs-on: ubuntu-latest
    name: Type Coverage

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache Dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.composer/cache
            vendor
          key: ${{ runner.os }}-${{ runner.arch }}-php-8.5-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-php-8.5-composer-

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          extensions: json, dom, curl, libxml, mbstring, zip, intl
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --ansi --prefer-dist --optimize-autoloader

      # The plugin keys each result on the file's content hash, so a cache saved on
      # main is valid on every branch. A new composer.lock starts it empty again.
      - name: Cache Type Coverage Results
        uses: actions/cache@v6
        with:
          path: vendor/pestphp/pest-plugin-type-coverage/.temp
          key: ${{ runner.os }}-type-coverage-${{ hashFiles('composer.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-type-coverage-${{ hashFiles('composer.lock') }}-

      - name: Prepare Laravel Application
        run: |
          cp .env.ci .env
          php artisan key:generate
          php artisan passport:keys --force --no-interaction

      - name: Run Type Coverage
        run: composer test:type-coverage

  tests:
    # x64 runners draw CPUs up to 1.65x apart, and the slowest shard sets the wall time.
    # Arm runners give four real Neoverse-N2 cores every time.
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        php: [8.5]
        shard: [1, 2, 3, 4, 5, 6, 7, 8]

    name: Tests (Shard ${{ matrix.shard }}/8)

    services:
      postgres:
        image: postgres:alpine
        env:
          POSTGRES_DB: relaticle_testing
          POSTGRES_PASSWORD: postgres
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache Dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.composer/cache
            vendor
          key: ${{ runner.os }}-${{ runner.arch }}-php-8.5-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-php-8.5-composer-

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, dom, curl, libxml, mbstring, zip, intl
          tools: composer:v2
          coverage: none

      - name: Setup Problem Matches
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --ansi --prefer-dist --optimize-autoloader

      # No Node here on purpose: TestCase calls withoutVite() for every non-Browser
      # test, so these shards never read the Vite manifest. Only browser-tests builds.

      - name: Prepare Laravel
        run: |
          cp .env.ci .env
          php artisan key:generate
          php artisan passport:keys --force --no-interaction

      # The newest recording from a main run's Record Shard Timings job. The committed file is the fallback.
      - name: Restore shard timings
        uses: actions/cache/restore@v6
        with:
          path: tests/.pest/shards.json
          key: pest-timings-${{ github.run_id }}
          restore-keys: pest-timings-

      - name: Tests
        run: composer test:pest:ci -- --log-junit junit.xml
        env:
          SHARD: ${{ matrix.shard }}/8

      - name: Upload timings
        uses: actions/upload-artifact@v7
        with:
          name: junit-tests-${{ matrix.shard }}
          path: junit.xml
          retention-days: 1

  self-hosted-build:
    runs-on: ubuntu-24.04-arm
    name: Self-hosted Build

    services:
      postgres:
        image: postgres:alpine
        env:
          POSTGRES_DB: relaticle_testing
          POSTGRES_PASSWORD: postgres
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache Dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.composer/cache
            vendor
          key: ${{ runner.os }}-${{ runner.arch }}-php-8.5-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-php-8.5-composer-

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          extensions: json, dom, curl, libxml, mbstring, zip, intl
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --ansi --prefer-dist --optimize-autoloader

      - name: Prepare Laravel
        run: |
          cp .env.ci .env
          php artisan key:generate
          php artisan passport:keys --force --no-interaction

      # A clone install keeps the directory and leaves the switch unset.
      - name: Boot with the cloud package switched off
        run: |
          sed -i '/^RELATICLE_CLOUD=/d' .env
          routes=$(php artisan route:list --json)
          if grep -q '"uri":"pricing"' <<<"$routes"; then
            echo "the cloud package loaded with RELATICLE_CLOUD unset"
            exit 1
          fi
          routes=$(RELATICLE_CLOUD=true php artisan route:list --json)
          grep -q '"uri":"pricing"' <<<"$routes"

      # The image never contains packages/Cloud. The optimized classmap still lists
      # its classes, so the autoload is rebuilt before Laravel boots.
      - name: Remove the cloud package
        run: |
          rm -rf packages/Cloud
          composer dump-autoload

      # Feature repeats the shards' tests with Cloud removed and takes about ten minutes, so only
      # pushes to main run it. Pull requests and releases run Arch and Smoke.
      - name: Tests
        run: vendor/bin/pest --compact --parallel --configuration phpunit.ci.xml --testsuite=${{ github.event_name == 'push' && 'Arch,Smoke,Feature' || 'Arch,Smoke' }} --ci --no-tia

  browser-tests:
    runs-on: ${{ matrix.browser == 'webkit' && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
        browser: [chromium]
        # Tests tagged `pest()->group('webkit')` cover surfaces where WebKit has broken
        # while Chromium passed: the rich editor freeze, the model picker icons.
        include:
          - shard: webkit
            browser: webkit

    name: Browser Tests (${{ matrix.browser == 'webkit' && 'WebKit' || format('Shard {0}/5', matrix.shard) }})

    # A browser test that waits on an element which never appears hangs rather
    # than fails, and without a ceiling the job runs until GitHub cancels it at
    # six hours. A shard finishes in about two minutes.
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:alpine
        env:
          POSTGRES_DB: relaticle_testing
          POSTGRES_PASSWORD: postgres
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache Dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.composer/cache
            vendor
          key: ${{ runner.os }}-${{ runner.arch }}-php-8.5-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-php-8.5-composer-

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          extensions: json, dom, curl, libxml, mbstring, zip, intl
          tools: composer:v2
          coverage: none

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: pnpm

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --ansi --prefer-dist --optimize-autoloader

      # Playwright re-downloads Chromium (~150MB) on every run without this.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ matrix.browser }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Prepare Laravel
        run: |
          cp .env.ci .env
          php artisan key:generate
          php artisan passport:keys --force --no-interaction

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build assets
        run: pnpm run build

      - name: Install Playwright
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Install Playwright system dependencies
        run: pnpm exec playwright install-deps ${{ matrix.browser }}
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - name: Restore shard timings
        uses: actions/cache/restore@v6
        with:
          path: tests/.pest/shards.json
          key: pest-timings-${{ github.run_id }}
          restore-keys: pest-timings-

      - name: Browser Tests
        run: vendor/bin/pest tests/Browser/ --configuration phpunit.ci.xml ${{ matrix.browser == 'webkit' && '--group=webkit --browser safari' || format('--shard={0}/5 --parallel --processes=3', matrix.shard) }} --log-junit junit.xml

      # The WebKit job reruns classes the Chromium shards already time, so it records nothing.
      - name: Upload timings
        if: matrix.browser != 'webkit'
        uses: actions/upload-artifact@v7
        with:
          name: junit-browser-${{ matrix.shard }}
          path: junit.xml
          retention-days: 1

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-${{ matrix.shard }}
          path: |
            tests/Browser/Screenshots
            storage/logs
          if-no-files-found: ignore

  # Pest refuses --update-shards with --shard, so main runs rebuild tests/.pest/shards.json from
  # the JUnit reports of their own shards, and the next run splits by those timings.
  shard-timings:
    runs-on: ubuntu-latest
    name: Record Shard Timings
    needs: [tests, browser-tests]
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download timings
        uses: actions/download-artifact@v8
        with:
          pattern: junit-*
          path: junit

      - name: Write shards.json
        run: php bin/shard-timings.php junit

      - name: Save timings
        uses: actions/cache/save@v6
        with:
          path: tests/.pest/shards.json
          key: pest-timings-${{ github.run_id }}

  # The one check branch protection requires, so resharding or renaming a job above
  # never leaves auto-merge waiting on a check that no longer reports.
  passed:
    runs-on: ubuntu-latest
    name: All Checks Passed
    needs: [lint-and-static-analysis, type-coverage, tests, self-hosted-build, browser-tests]
    if: always()

    steps:
      - name: Fail unless every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [[ "$result" != success ]]; then
              echo "::error::A CI job ended with: $result"
              exit 1
            fi
          done
