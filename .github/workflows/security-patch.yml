name: Security Patch

# Packagist publishes an advisory hours or days before the GitHub Advisory Database, and
# Dependabot only acts on the latter. This polls `composer audit` instead and opens one pull
# request with the fix. security-release.yml ships it once it merges.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-patch

jobs:
  patch:
    if: github.repository == 'relaticle/relaticle'
    runs-on: ubuntu-latest
    name: Patch Composer Advisories
    timeout-minutes: 15

    env:
      BRANCH: security/composer-advisories

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: 8.5
          extensions: json, dom, curl, libxml, mbstring, zip, intl
          tools: composer:v2
          coverage: none

      - name: Update packages with advisories
        id: patch
        run: |
          result="$(bin/composer-security-patch.sh "$RUNNER_TEMP/security-patch.md")"
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Create bot token
        id: token
        if: steps.patch.outputs.result != 'clean'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SECURITY_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SECURITY_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Open the pull request
        if: steps.patch.outputs.result == 'patched'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # Also true when someone closed the pull request unmerged: it stays closed until the lock changes.
          if git fetch --quiet "$remote" "$BRANCH" 2>/dev/null && git diff --quiet FETCH_HEAD -- composer.lock; then
            echo "The $BRANCH branch already carries this lock."
            exit 0
          fi

          bot_id="$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git switch --quiet --force-create "$BRANCH"
          git commit --quiet --all --message "fix(deps): patch composer security advisories"
          git push --quiet --force "$remote" "HEAD:refs/heads/$BRANCH"

          open_pr="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"

          if [[ -n "$open_pr" ]]; then
            gh pr edit "$open_pr" --body-file "$RUNNER_TEMP/security-patch.md"
            exit 0
          fi

          gh pr create --base main --head "$BRANCH" --label dependencies \
            --title "fix(deps): patch composer security advisories" \
            --body-file "$RUNNER_TEMP/security-patch.md"

      - name: Merge once checks pass
        if: steps.patch.outputs.result == 'patched'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          if [[ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')" ]]; then
            gh pr merge "$BRANCH" --auto --merge
          fi

      - name: Report advisories that need a constraint change
        if: steps.patch.outputs.result == 'unresolved'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          TITLE: Composer security advisories need a constraint change
        run: |
          issue="$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')"

          if [[ -n "$issue" ]]; then
            gh issue edit "$issue" --body-file "$RUNNER_TEMP/security-patch.md"
            exit 0
          fi

          gh issue create --title "$TITLE" --label dependencies --body-file "$RUNNER_TEMP/security-patch.md"
