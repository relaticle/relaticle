name: Tests

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same PR makes the in-flight run obsolete, so cancel it and the
# runners go to the newest commit instead of finishing work nobody will read.
# Pushes to main are never cancelled: every merged commit gets a verdict, and each
# one refreshes the main-scoped caches that tag-triggered release runs restore from.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
