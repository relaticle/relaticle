name: Tests

on: [pull_request]

# A new push to the same PR makes the in-flight run obsolete — cancel it so the
# runners go to the newest commit instead of finishing work nobody will read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-static-analysis:
    runs-on: ubuntu-latest
    name: Code Quality Checks

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache
            vendor
          key: ${{ runner.os }}-php-8.5-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.5-composer-

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          extensions: json, dom, curl, libxml, mbstring, zip, intl
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --ansi --prefer-dist --optimize-autoloader

      # PHPStan and Rector both do a full cold analysis without their result cache
      # (~22s each). The key is deliberately stable — one entry per dependency and
      # config set, reused by every PR — because the PHPStan cache is ~150MB and a
      # per-commit key would churn through the repo's 10GB cache budget. Both tools
      # revalidate changed files against a restored cache, so staleness is safe.
      - name: Cache Static Analysis Results
        uses: actions/cache@v4
        with:
          path: .cache
          key: ${{ runner.os }}-static-analysis-${{ hashFiles('composer.lock', 'phpstan.neon', 'rector.php') }}
          restore-keys: |
            ${{ runner.os }}-static-analysis-

      - name: Prepare Laravel Application
        run: |
          cp .env.ci .env
          php artisan key:generate
          php artisan passport:keys --force --no-interaction

      - name: Run Lint
        run: composer test:lint

      - name: Run Refactor Check
        run: composer test:refactor

      # pest-plugin-type-coverage v5 corrupts its own cache under fork
      # contention: Cache::withinLock() gives up after 100 failed flock attempts
      # and runs the write anyway, unlocked, so parallel forks interleave
      # file_put_contents and the generated PHP file stops parsing.
      #
      # The cache only helps repeat runs, and every CI run starts from a fresh
      # checkout, so make it unwritable — the plugin already treats a failed
      # write as a cache miss. Warnings about the unwritable path are expected.
      # Lowering fork concurrency is not an alternative: Analyser.php divides
      # the process count by 3, so anything not divisible by 3 hits a TypeError.
      - name: Run Type Coverage
        run: |
          rm -rf vendor/pestphp/pest-plugin-type-coverage/.temp
          mkdir -p vendor/pestphp/pest-plugin-type-coverage/.temp
          chmod 555 vendor/pestphp/pest-plugin-type-coverage/.temp
          composer test:type-coverage

      - name: Run Static Analysis
        run: composer test:types

      # Architecture tests are not run here: tests/Arch is a testsuite in
      # phpunit.ci.xml, so the sharded `tests` job already executes all of them.

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [8.5]
        shard: [1, 2, 3, 4, 5]

    name: Tests (Shard ${{ matrix.shard }}/5)

    services:
      postgres:
        image: postgres:alpine
        env:
          POSTGRES_DB: relaticle_testing
          POSTGRES_PASSWORD: postgres
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache
            vendor
          key: ${{ runner.os }}-php-8.5-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.5-composer-

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, dom, curl, libxml, mbstring, zip, intl
          tools: composer:v2
          coverage: none

      - name: Setup Problem Matches
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --ansi --prefer-dist --optimize-autoloader

      # No Node here on purpose: TestCase calls withoutVite() for every non-Browser
      # test, so these shards never read the Vite manifest. Only browser-tests builds.

      - name: Prepare Laravel
        run: |
          cp .env.ci .env
          php artisan key:generate
          php artisan passport:keys --force --no-interaction

      - name: Tests
        run: composer test:pest:ci
        env:
          SHARD: ${{ matrix.shard }}/5

  browser-tests:
    runs-on: ubuntu-latest
    name: Browser Tests

    # A browser test that waits on an element which never appears hangs rather
    # than fails, and without a ceiling the job runs until GitHub cancels it at
    # six hours. The suite finishes in about two minutes.
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:alpine
        env:
          POSTGRES_DB: relaticle_testing
          POSTGRES_PASSWORD: postgres
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache
            vendor
          key: ${{ runner.os }}-php-8.5-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.5-composer-

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          extensions: json, dom, curl, libxml, mbstring, zip, intl
          tools: composer:v2
          coverage: none

      - name: Set up Node & NPM
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --ansi --prefer-dist --optimize-autoloader

      # Playwright re-downloads Chromium (~150MB) on every run without this.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Prepare Laravel
        run: |
          cp .env.ci .env
          php artisan key:generate
          php artisan passport:keys --force --no-interaction

      - name: Install NPM dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Install Playwright
        run: npx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - name: Browser Tests
        run: vendor/bin/pest tests/Browser/ --configuration phpunit.ci.xml
