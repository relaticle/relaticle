name: Security Audit

on: [pull_request]

jobs:
  composer-audit:
    runs-on: ubuntu-latest
    name: Composer Audit

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache
            vendor
          key: ${{ runner.os }}-php-8.5-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.5-composer-

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          extensions: json, dom, curl, libxml, mbstring, zip, intl
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --ansi --prefer-dist --optimize-autoloader

      # composer audit has no severity threshold; fail on any reported advisory (>= low).
      # Medium-and-up gating is applied to the pnpm side below.
      - name: Run Composer Audit
        run: composer audit --locked --no-dev --ansi

  pnpm-audit:
    runs-on: ubuntu-latest
    name: pnpm Audit

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # moderate == "medium" severity (info/low/moderate/high/critical).
      - name: Run pnpm Audit
        run: pnpm audit --audit-level=moderate
