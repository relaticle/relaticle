name: Deploy

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Forge
    needs: [verify]

    # `needs` carries an implicit success() gate, so a failed, cancelled or skipped
    # verify already blocks this job without any status function here. All that is
    # left to state is that prereleases do not deploy, and that a manual dispatch
    # carries no release payload to check.
    if: ${{ github.event_name != 'release' || github.event.release.prerelease == false }}

    # A webhook that accepts the connection and then stalls would otherwise hang
    # until GitHub kills the job at six hours, with the release stuck in flight.
    # Worst case is six attempts at 60 seconds plus 31 seconds of backoff.
    timeout-minutes: 10

    steps:
      # Forge's webhook returned a proxy-level 502 on the v3.5.5 release while the
      # deploy itself went through, so a single unretried request reports failure for
      # a deploy that shipped. 502 is already in curl's transient set, as is a
      # timeout, so --max-time turns a stalled attempt into a retry rather than a
      # hang. --max-time resets per retry. Forge queues duplicate triggers and the
      # deploy script is idempotent, so retrying is cheaper than a false red release.
      - name: Trigger Forge Deploy
        run: |
          curl --fail --silent --show-error --location --retry 5 --max-time 60 \
            "${{ secrets.FORGE_DEPLOY_WEBHOOK }}"
