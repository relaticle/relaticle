name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: ${{ github.repository == 'relaticle/relaticle' }}
    runs-on: ubuntu-latest

    steps:
      # Pinned by SHA: this job holds a write token on pull_request_target.
      - name: CLA Assistant
        if: github.event_name == 'pull_request_target' || github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/relaticle/relaticle/blob/main/.github/CLA.md
          path-to-signatures: signatures/cla.json
          # main is protected, so signatures live on their own unprotected branch.
          branch: cla-signatures
          allowlist: ManukMinasyan,dependabot[bot],github-actions[bot]
          lock-pullrequest-aftermerge: false
