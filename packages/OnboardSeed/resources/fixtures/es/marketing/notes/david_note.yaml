title: 'Preferencias de estrategia de contenido de David'
noteable_type: people
noteable_key: david
custom_fields:
  body: '<p>David prefiere el contenido educativo extenso a las piezas promocionales. Recomienda empezar con conclusiones basadas en datos y casos de estudio en lugar de comparaciones de funciones. Tiene opiniones firmes sobre la frecuencia de los correos y prefiere no más de dos envíos por semana para evitar la fatiga de los suscriptores.</p>'
