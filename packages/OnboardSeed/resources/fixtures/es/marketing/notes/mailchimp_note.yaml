title: 'Referencias de rendimiento de campañas de Mailchimp'
noteable_type: company
noteable_key: mailchimp
custom_fields:
  body: '<p>Mailchimp compartió sus referencias más recientes para campañas de correo SaaS. Reportaron una tasa promedio de apertura del 22% y una tasa de clics del 3.1%. David sugirió probar una secuencia automatizada de 5 correos con asuntos personalizados antes de escalar a toda la lista. Sus herramientas de pruebas A/B podrían ayudar a optimizar los horarios de envío.</p>'
