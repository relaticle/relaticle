title: 'Objetivos de la alianza con HubSpot'
noteable_type: company
noteable_key: hubspot
custom_fields:
  body: '<p>HubSpot está interesada en una serie de seminarios web conjuntos y en contenido elaborado en coautoría, dirigido a empresas SaaS del segmento medio. Su equipo de socios tiene presupuesto asignado para iniciativas de comarketing del segundo trimestre. Rachel confirmó que pueden promocionarlo en su boletín, que llega a 500 mil suscriptores.</p>'
