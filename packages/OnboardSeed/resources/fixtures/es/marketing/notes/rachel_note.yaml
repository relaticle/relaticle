custom_fields:
  body: '<p>Rachel ha gestionado más de 30 alianzas de comarketing en HubSpot durante los últimos dos años. Prefiere briefs estructurados con KPI claros antes de iniciar cualquier campaña. El mejor momento para contactarla es de martes a jueves por la mañana.</p>'
