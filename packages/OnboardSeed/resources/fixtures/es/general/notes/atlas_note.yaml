title: 'Notas de dirección creativa de Atlas Design'
noteable_type: company
noteable_key: atlas_design
custom_fields:
  body: '<p>Atlas Design Studio busca una renovación completa de marca, que incluye logotipo, paleta de colores y material de marketing. Quieren una estética moderna y minimalista que atraiga tanto a clientes empresariales como a startups. Noah prefiere trabajar en sprints iterativos con sesiones periódicas de retroalimentación.</p>'
