title: 'Necesidades de asesoría de Summit Group'
noteable_type: company
noteable_key: summit_group
custom_fields:
  body: '<p>Summit Group está evaluando un contrato de asesoría trimestral para respaldar su expansión a nuevos mercados. Sophia indicó que necesitan ayuda con investigación de mercado, análisis competitivo y estrategia de salida al mercado. Antes trabajaron con una firma más grande, pero ahora buscan un socio más cercano.</p>'
