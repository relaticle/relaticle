title: 'Proceso de decisión de Olivia'
noteable_type: people
noteable_key: olivia
custom_fields:
  body: '<p>Olivia es la principal responsable de las decisiones sobre consultoría en Horizon Labs. Normalmente involucra a su líder de operaciones en las aprobaciones finales del presupuesto. Prefiere propuestas detalladas con hitos claros y resultados medibles antes de comprometerse con contratos a largo plazo.</p>'
