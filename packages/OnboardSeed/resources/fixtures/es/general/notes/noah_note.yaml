title: 'Preferencias de diseño de Noah'
noteable_type: people
noteable_key: noah
custom_fields:
  body: '<p>Noah tiene una marcada preferencia por la tipografía limpia y los espacios en blanco generosos. Mencionó que su marca actual se siente anticuada y quiere algo que destaque sin seguir modas. Valora la coherencia entre los materiales digitales e impresos. Responde mejor a maquetas visuales que a briefs escritos.</p>'
