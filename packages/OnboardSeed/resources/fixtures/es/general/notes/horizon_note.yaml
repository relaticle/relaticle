title: 'Conversación sobre el alcance del proyecto de Horizon Labs'
noteable_type: company
noteable_key: horizon_labs
custom_fields:
  body: '<p>Horizon Labs está interesada en un servicio de consultoría de seis meses centrado en la eficiencia operativa. Olivia mencionó que quieren agilizar su proceso de incorporación de clientes y mejorar los reportes internos. El presupuesto es flexible si podemos demostrar un retorno de inversión claro durante el primer trimestre.</p>'
