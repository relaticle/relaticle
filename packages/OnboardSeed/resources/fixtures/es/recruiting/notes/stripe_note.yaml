title: 'Prioridades de contratación de ingeniería en Stripe'
noteable_type: company
noteable_key: stripe
custom_fields:
  body: '<p>Stripe está ampliando su equipo de infraestructura de pagos y necesita ingenieros sénior con experiencia en sistemas distribuidos. Prefieren candidatos que hayan trabajado a gran escala y se sientan cómodos con sistemas financieros. El plazo es muy exigente: quieren a alguien incorporado en 6 semanas.</p>'
