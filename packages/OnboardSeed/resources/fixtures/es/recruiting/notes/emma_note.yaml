title: 'Experiencia de liderazgo de Emma Thompson'
noteable_type: people
noteable_key: emma
custom_fields:
  body: '<p>Emma ha dirigido equipos de ingeniería de hasta 25 personas en dos puestos anteriores. Lideró la migración de un monolito a microservicios en su última empresa e hizo crecer el equipo de plataforma de 4 a 12 ingenieros en 18 meses. Su estilo de gestión enfatiza la autonomía y una dirección técnica clara. Se esperan referencias sólidas tanto de sus subordinados directos como de sus colegas.</p>'
