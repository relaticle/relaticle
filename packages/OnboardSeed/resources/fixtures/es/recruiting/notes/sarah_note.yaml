title: 'Comentarios de la entrevista con Sarah Chen'
noteable_type: people
noteable_key: sarah
custom_fields:
  body: '<p>Sarah tuvo un buen desempeño en la primera llamada de selección. Tiene una sólida experiencia en sistemas distribuidos, adquirida en una startup de tecnología financiera. Hizo preguntas muy pertinentes sobre la estrategia de versionado de la API de Stripe. Se recomienda avanzar a la ronda de entrevista técnica. Cabe señalar que tiene otras ofertas y busca decidir en un plazo de tres semanas.</p>'
