title: 'Ampliación del equipo de diseño de Linear'
noteable_type: company
noteable_key: linear
custom_fields:
  body: '<p>El equipo de diseño de Linear es pequeño y muy selectivo. Valoran el oficio y la atención al detalle por encima de todo. La persona candidata ideal debería tener experiencia diseñando herramientas para desarrolladores y entender los matices de crear interfaces rápidas y orientadas al teclado. La revisión del portafolio es la etapa más crítica de su proceso.</p>'
