title: 'Requisitos de encaje cultural en Vercel'
noteable_type: company
noteable_key: vercel
custom_fields:
  body: '<p>Vercel da mucha importancia al encaje cultural en los puestos de gestión de ingeniería. Buscan líderes con gran capacidad técnica y también buenos comunicadores. El responsable de contratación insistió en que los candidatos deben demostrar experiencia con equipos totalmente remotos y participación en comunidades de código abierto. Haber escalado equipos de infraestructura de frontend es un punto muy a favor.</p>'
