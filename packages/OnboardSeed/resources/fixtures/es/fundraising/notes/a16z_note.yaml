custom_fields:
  body: '<p>Reunión con los socios programada con el fondo de crecimiento de a16z. Marc quiere entender nuestra estrategia de salida al mercado empresarial y nuestra ventaja competitiva. Preparar una hoja de ruta de producto detallada y casos de estudio de clientes para la presentación.</p>'
