title: 'Primera conversación con Sequoia'
noteable_type: company
noteable_key: sequoia
custom_fields:
  body: '<p>Sequoia tiene mucho interés en liderar nuestra Serie A. Alfred lo impulsa internamente. Quieren ver 3 meses de datos de crecimiento y un camino claro hacia $10M de ARR. El siguiente paso es una sesión a fondo con su equipo de crecimiento.</p>'
