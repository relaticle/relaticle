title: 'Conversación sobre la Serie B con Greylock'
noteable_type: company
noteable_key: greylock
custom_fields:
  body: '<p>Reid está entusiasmado con nuestra tesis de efectos de red. Greylock evalúa liderar nuestra Serie B con una valoración de más de $100M. Quieren ver el desglose de la economía unitaria y los datos de retención por cohorte antes de la próxima reunión de socios.</p>'
