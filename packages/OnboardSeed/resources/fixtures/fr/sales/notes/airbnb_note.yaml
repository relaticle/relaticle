title: Intégration de la plateforme d'hôtellerie
noteable_type: company
noteable_key: airbnb
custom_fields:
  body: <p>Airbnb souhaite enrichir ses outils pour les hôtes avec notre solution d'analyse. Brian s'intéresse à un tableau de bord sur mesure qui aiderait les hôtes à mieux comprendre les préférences de leurs voyageurs.</p>