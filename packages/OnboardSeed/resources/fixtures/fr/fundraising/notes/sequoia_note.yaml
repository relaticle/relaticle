title: Première conversation avec Sequoia
noteable_type: company
noteable_key: sequoia
custom_fields:
  body: "<p>Sequoia est très intéressé par la direction de notre Series A. Alfred porte le dossier en interne. Ils veulent voir 3 mois de données de croissance et une trajectoire claire vers 10 M$ d'ARR. La prochaine étape est une session approfondie avec leur équipe croissance.</p>"
