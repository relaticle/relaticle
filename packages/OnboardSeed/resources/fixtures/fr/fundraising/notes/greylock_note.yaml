title: Échange sur la Series B avec Greylock
noteable_type: company
noteable_key: greylock
custom_fields:
  body: "<p>Reid est enthousiasmé par notre thèse sur les effets de réseau. Greylock envisage de mener notre Series B avec une valorisation de plus de 100 M$. Ils veulent voir le détail de l'économie unitaire et les données de rétention par cohorte avant la prochaine réunion des partners.</p>"
