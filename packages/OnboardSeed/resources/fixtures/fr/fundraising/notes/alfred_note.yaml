title: Relecture du brouillon du mémo d'investissement
noteable_type: people
noteable_key: alfred
custom_fields:
  body: "<p>Alfred a partagé ses retours sur le brouillon de notre mémo d'investissement. Il suggère surtout de renforcer l'analyse du TAM avec des calculs ascendants, de détailler davantage le paysage concurrentiel et d'ajouter des témoignages de clients grands comptes.</p>"
