title: Conditions du tour d'amorçage Benchmark
noteable_type: company
noteable_key: benchmark
custom_fields:
  body: "<p>Benchmark a envoyé un premier term sheet pour le tour d'amorçage. 2 M$ pour une valorisation post-money de 20 M$. Peter a indiqué qu'ils prennent en général un siège au conseil. Il faut le relire avec le conseil juridique avant de répondre.</p>"
