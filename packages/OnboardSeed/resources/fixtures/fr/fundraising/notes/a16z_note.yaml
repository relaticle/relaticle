title: Préparation de la réunion avec le fonds de croissance a16z
noteable_type: company
noteable_key: a16z
custom_fields:
  body: "<p>Une réunion avec les partners du fonds de croissance a16z est planifiée. Marc veut comprendre notre stratégie de mise sur le marché grands comptes et notre avantage concurrentiel. Préparez une feuille de route produit détaillée et des études de cas clients pour la présentation.</p>"
