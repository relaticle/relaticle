title: Retours d'entretien sur Sarah Chen
noteable_type: people
noteable_key: sarah
custom_fields:
  body: <p>Sarah a convaincu lors du premier entretien téléphonique. Elle a une solide expérience des systèmes distribués, acquise dans une startup fintech. Elle a posé des questions pertinentes sur la stratégie de versionnage de l'API de Stripe. Je recommande de passer à l'entretien technique. Elle a d'autres offres et vise une décision d'ici trois semaines.</p>
