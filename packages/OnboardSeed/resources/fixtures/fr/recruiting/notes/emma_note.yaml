title: Expérience de leadership d'Emma Thompson
noteable_type: people
noteable_key: emma
custom_fields:
  body: <p>Emma a dirigé des équipes d'ingénierie allant jusqu'à 25 personnes dans deux postes précédents. Elle a mené la migration d'un monolithe vers des microservices dans sa dernière entreprise. Elle y a fait passer l'équipe plateforme de 4 à 12 ingénieurs en 18 mois. Son style de management met l'accent sur l'autonomie et sur une direction technique claire. On attend de bonnes références, aussi bien de ses collaborateurs directs que de ses pairs.</p>
