title: Renforcement de l'équipe design de Linear
noteable_type: company
noteable_key: linear
custom_fields:
  body: <p>L'équipe design de Linear est petite et très sélective. Elle valorise avant tout le savoir-faire et le souci du détail. Le candidat idéal a déjà conçu des outils pour développeurs et maîtrise les subtilités des interfaces rapides pilotées au clavier. L'examen du portfolio est l'étape la plus décisive de leur processus.</p>
