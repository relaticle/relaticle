title: Priorités de recrutement en ingénierie chez Stripe
noteable_type: company
noteable_key: stripe
custom_fields:
  body: <p>Stripe renforce son équipe d'infrastructure de paiement et recherche des ingénieurs seniors expérimentés en systèmes distribués. Ils préfèrent des candidats qui ont travaillé à grande échelle et connaissent les systèmes financiers. Le calendrier est serré. Ils veulent quelqu'un d'opérationnel sous 6 semaines.</p>
