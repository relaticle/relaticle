title: Exigences d'adéquation culturelle chez Vercel
noteable_type: company
noteable_key: vercel
custom_fields:
  body: <p>Vercel accorde une grande importance à l'adéquation culturelle pour les postes de management en ingénierie. Ils recherchent des leaders très techniques, mais aussi de bons communicants. Le responsable du recrutement a insisté sur l'expérience des équipes remote-first et sur l'engagement auprès de la communauté open source. Avoir déjà fait grandir des équipes d'infrastructure front-end est un vrai plus.</p>
