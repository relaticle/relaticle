title: Analyse du ROI de l'intégration Clearbit
noteable_type: company
noteable_key: clearbit
custom_fields:
  body: <p>L'API d'enrichissement de données de Clearbit pourrait réduire de 40 % notre temps de qualification des leads. Leurs signaux d'intention nous permettraient de lancer des campagnes automatiquement dès qu'une entreprise cible montre un comportement d'achat. Alex a évoqué un programme pilote avec des coûts d'API réduits pour les partenaires de co-marketing.</p>
