title: Objectifs du partenariat HubSpot
noteable_type: company
noteable_key: hubspot
custom_fields:
  body: <p>HubSpot s'intéresse à une série de webinaires communs et à des contenus co-rédigés destinés aux entreprises SaaS de taille intermédiaire. Leur équipe partenariats a un budget prévu pour les initiatives de co-marketing du T2. Rachel a confirmé qu'ils peuvent relayer l'opération dans leur newsletter, qui touche 500 000 abonnés.</p>
