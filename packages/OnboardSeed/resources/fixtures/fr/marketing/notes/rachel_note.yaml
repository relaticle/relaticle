title: Parcours de Rachel en partenariats
noteable_type: people
noteable_key: rachel
custom_fields:
  body: <p>Rachel a géré plus de 30 partenariats de co-marketing chez HubSpot ces deux dernières années. Elle préfère des briefs structurés, avec des KPI clairs, avant de lancer une campagne. Le meilleur moment pour la joindre est du mardi au jeudi matin.</p>
