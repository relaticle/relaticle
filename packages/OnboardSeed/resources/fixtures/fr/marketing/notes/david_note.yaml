title: Préférences de David en stratégie de contenu
noteable_type: people
noteable_key: david
custom_fields:
  body: <p>David privilégie les contenus pédagogiques longs plutôt que les contenus promotionnels. Il recommande de s'appuyer sur des analyses chiffrées et des études de cas plutôt que sur des comparatifs de fonctionnalités. Il a des idées arrêtées sur la fréquence des e-mails et ne veut pas plus de deux envois par semaine, pour éviter la lassitude des abonnés.</p>
