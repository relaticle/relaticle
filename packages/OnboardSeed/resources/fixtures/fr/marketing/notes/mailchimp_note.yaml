title: Benchmarks de performance des campagnes Mailchimp
noteable_type: company
noteable_key: mailchimp
custom_fields:
  body: "<p>Mailchimp a partagé ses derniers benchmarks pour les campagnes e-mail SaaS. Le taux d'ouverture moyen est de 22 % et le taux de clic de 3,1 %. David propose de tester une séquence automatisée en 5 e-mails avec des objets personnalisés avant de l'étendre à toute la liste. Leurs outils de test A/B pourraient aider à optimiser les heures d'envoi.</p>"
