title: Besoins de conseil de Summit Group
noteable_type: company
noteable_key: summit_group
custom_fields:
  body: <p>Summit Group étudie un contrat de conseil trimestriel pour accompagner son expansion sur de nouveaux marchés. Sophia a indiqué avoir besoin d'aide pour l'étude de marché, l'analyse concurrentielle et la stratégie de mise sur le marché. Ils travaillaient auparavant avec un cabinet plus grand, mais veulent un partenaire plus impliqué.</p>
