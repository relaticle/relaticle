title: Préférences de design de Noah
noteable_type: people
noteable_key: noah
custom_fields:
  body: <p>Noah tient beaucoup à une typographie épurée et à de généreux espaces blancs. Il trouve leur image de marque actuelle datée et veut quelque chose qui se démarque sans suivre les modes. Il attache de l'importance à la cohérence entre supports numériques et imprimés. Il réagit mieux à des maquettes visuelles qu'à des briefs écrits.</p>
