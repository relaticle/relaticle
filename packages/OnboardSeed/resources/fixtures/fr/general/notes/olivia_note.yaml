title: Processus de décision d'Olivia
noteable_type: people
noteable_key: olivia
custom_fields:
  body: <p>Olivia est la principale décideuse pour les missions de conseil chez Horizon Labs. Elle associe en général son responsable des opérations aux validations budgétaires finales. Elle préfère des propositions détaillées, avec des jalons clairs et des résultats mesurables, avant de s'engager sur des contrats de longue durée.</p>
