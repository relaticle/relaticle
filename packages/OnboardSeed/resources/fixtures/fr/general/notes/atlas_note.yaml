title: Notes sur la direction créative d'Atlas Design
noteable_type: company
noteable_key: atlas_design
custom_fields:
  body: '<p>Atlas Design Studio cherche à renouveler entièrement son identité de marque : logo, palette de couleurs et supports marketing. Il veut une esthétique moderne et minimaliste qui séduise à la fois les grands comptes et les startups. Noah préfère travailler par sprints itératifs, avec des points de retour réguliers.</p>'
