title: Discussion sur le périmètre du projet Horizon Labs
noteable_type: company
noteable_key: horizon_labs
custom_fields:
  body: <p>Horizon Labs s'intéresse à une mission de conseil de six mois centrée sur l'efficacité opérationnelle. Olivia a indiqué vouloir simplifier le processus d'intégration de leurs clients et améliorer le reporting interne. Le budget est flexible si nous démontrons un ROI clair dès le premier trimestre.</p>
