title: Davids Präferenzen zur Content-Strategie
noteable_type: people
noteable_key: david
custom_fields:
  body: <p>David bevorzugt lange, lehrreiche Inhalte gegenüber Werbebeiträgen. Er empfiehlt, mit datenbasierten Erkenntnissen und Fallstudien zu beginnen statt mit Funktionsvergleichen. Beim E-Mail-Rhythmus hat er klare Ansichten und empfiehlt höchstens zwei Nachrichten pro Woche, damit die Abonnenten nicht ermüden.</p>
