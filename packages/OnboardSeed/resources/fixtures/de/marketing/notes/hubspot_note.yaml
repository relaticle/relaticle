title: Ziele der HubSpot-Partnerschaft
noteable_type: company
noteable_key: hubspot
custom_fields:
  body: <p>HubSpot interessiert sich für eine gemeinsame Webinarreihe und gemeinsam verfasste Inhalte für SaaS-Unternehmen im Mittelstand. Das Partnerteam hat Budget für Co-Marketing-Initiativen im zweiten Quartal eingeplant. Rachel bestätigte, dass HubSpot über den eigenen Newsletter mit 500.000 Abonnenten werben kann.</p>
