title: Rachels Partnerschaftserfahrung
noteable_type: people
noteable_key: rachel
custom_fields:
  body: <p>Rachel hat bei HubSpot in den letzten zwei Jahren über 30 Co-Marketing-Partnerschaften betreut. Sie bevorzugt strukturierte Briefings mit klaren KPIs, bevor eine Kampagne startet. Am besten erreichen Sie sie dienstags bis donnerstags am Vormittag.</p>
