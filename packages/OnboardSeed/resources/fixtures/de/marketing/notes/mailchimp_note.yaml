title: Leistungskennzahlen der Mailchimp-Kampagnen
noteable_type: company
noteable_key: mailchimp
custom_fields:
  body: "<p>Mailchimp hat die aktuellen Benchmarks für SaaS-E-Mail-Kampagnen geteilt. Die durchschnittliche Öffnungsrate liegt bei 22 % und die Klickrate bei 3,1 %. David schlug vor, vor dem Rollout auf die gesamte Liste eine Drip-Serie mit 5 E-Mails und personalisierten Betreffzeilen zu testen. Die A/B-Test-Tools könnten helfen, die Versandzeiten zu optimieren.</p>"
