custom_fields:
  body: <p>Der erste Termin mit Figma ist gut verlaufen. Figma interessiert sich für unsere Enterprise-Lösungen und möchte bis nächste Woche ein Angebot erhalten. Wichtigster Entscheider ist Dylan.</p>