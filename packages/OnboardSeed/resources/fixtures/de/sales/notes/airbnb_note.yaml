title: Integration der Hospitality-Plattform
noteable_type: company
noteable_key: airbnb
custom_fields:
  body: <p>Airbnb möchte die Tools für Gastgeber mit unserer Analyselösung erweitern. Brian interessiert sich für ein individuelles Dashboard, mit dem Gastgeber die Vorlieben ihrer Gäste besser verstehen.</p>