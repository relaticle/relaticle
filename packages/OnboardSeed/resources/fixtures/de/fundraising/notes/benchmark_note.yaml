title: Konditionen der Benchmark-Seed-Runde
noteable_type: company
noteable_key: benchmark
custom_fields:
  body: "<p>Benchmark hat ein erstes Term Sheet für die Seed-Runde geschickt. 2 Mio. $ bei einer Post-Money-Bewertung von 20 Mio. $. Peter erwähnte, dass Benchmark in der Regel einen Sitz im Board übernimmt. Vor der Antwort müssen wir das mit der Rechtsberatung klären.</p>"
