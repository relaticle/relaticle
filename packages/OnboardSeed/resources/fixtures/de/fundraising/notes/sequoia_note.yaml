title: Erstes Gespräch mit Sequoia
noteable_type: company
noteable_key: sequoia
custom_fields:
  body: "<p>Sequoia hat großes Interesse, unsere Series A anzuführen. Alfred setzt sich intern dafür ein. Gewünscht sind Wachstumsdaten aus 3 Monaten und ein klarer Weg zu 10 Mio. $ ARR. Nächster Schritt ist eine Deep-Dive-Session mit dem Growth-Team.</p>"
