title: Gespräch zur Greylock Series B
noteable_type: company
noteable_key: greylock
custom_fields:
  body: "<p>Reid ist von unserer These zu Netzwerkeffekten begeistert. Greylock erwägt, unsere Series B bei einer Bewertung von über 100 Mio. $ anzuführen. Vor dem nächsten Partner-Meeting möchte Greylock die Unit Economics und Kohorten-Retention-Daten sehen.</p>"
