title: Überprüfung des Entwurfs für das Investment-Memo
noteable_type: people
noteable_key: alfred
custom_fields:
  body: "<p>Alfred hat Feedback zum Entwurf unseres Investment-Memos geteilt. Er empfiehlt unter anderem, die TAM-Analyse mit Bottom-up-Berechnungen zu stärken, das Wettbewerbsumfeld ausführlicher darzustellen und Kundenstimmen aus Enterprise-Accounts aufzunehmen.</p>"
