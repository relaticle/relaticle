title: Beratungsbedarf der Summit Group
noteable_type: company
noteable_key: summit_group
custom_fields:
  body: <p>Die Summit Group prüft einen vierteljährlichen Beratungs-Retainer für die Expansion in neue Märkte. Sophia benötigt Unterstützung bei Marktforschung, Wettbewerbsanalyse und Go-to-Market-Strategie. Zuvor arbeitete die Gruppe mit einer größeren Beratung zusammen, wünscht sich nun aber einen Partner, der stärker mit anpackt.</p>
