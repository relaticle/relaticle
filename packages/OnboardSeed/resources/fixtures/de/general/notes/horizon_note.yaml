title: Besprechung des Projektumfangs mit Horizon Labs
noteable_type: company
noteable_key: horizon_labs
custom_fields:
  body: <p>Horizon Labs interessiert sich für ein sechsmonatiges Beratungsmandat mit Schwerpunkt auf operativer Effizienz. Olivia möchte das Onboarding der Kunden straffen und das interne Reporting verbessern. Das Budget ist flexibel, wenn wir im ersten Quartal einen klaren ROI belegen können.</p>
