title: Olivias Entscheidungsprozess
noteable_type: people
noteable_key: olivia
custom_fields:
  body: <p>Olivia entscheidet bei Horizon Labs über Beratungsmandate. Bei der finalen Budgetfreigabe bindet sie in der Regel ihre Operations-Leitung ein. Sie bevorzugt ausführliche Angebote mit klaren Meilensteinen und messbaren Ergebnissen, bevor sie langfristige Verträge eingeht.</p>
