title: Notizen zur kreativen Ausrichtung von Atlas Design
noteable_type: company
noteable_key: atlas_design
custom_fields:
  body: <p>Atlas Design Studio sucht eine komplette Markenerneuerung mit Logo, Farbpalette und Marketingmaterial. Gewünscht ist eine moderne, minimalistische Ästhetik, die Großkunden und Startups gleichermaßen anspricht. Noah arbeitet am liebsten in iterativen Sprints mit regelmäßigen Feedbackrunden.</p>
