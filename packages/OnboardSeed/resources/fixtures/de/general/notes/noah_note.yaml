title: Noahs Designvorlieben
noteable_type: people
noteable_key: noah
custom_fields:
  body: <p>Noah legt großen Wert auf klare Typografie und viel Weißraum. Das aktuelle Branding wirke veraltet, er wünscht sich etwas Eigenständiges ohne Trendanleihen. Ihm ist Konsistenz über digitale und gedruckte Medien wichtig. Visuelle Entwürfe überzeugen ihn mehr als schriftliche Briefings.</p>
