title: Erweiterung des Design-Teams bei Linear
noteable_type: company
noteable_key: linear
custom_fields:
  body: <p>Das Design-Team von Linear ist klein und sehr selektiv. Handwerk und Liebe zum Detail zählen vor allem anderen. Ideal wäre Erfahrung im Design von Entwickler-Tools und ein Gespür für schnelle, tastaturgesteuerte Oberflächen. Die Portfolio-Prüfung ist die wichtigste Phase im Prozess.</p>
