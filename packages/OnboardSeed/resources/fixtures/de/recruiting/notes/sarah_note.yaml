title: Interview-Feedback zu Sarah Chen
noteable_type: people
noteable_key: sarah
custom_fields:
  body: '<p>Sarah hat im ersten Telefoninterview überzeugt. Sie bringt viel Erfahrung mit verteilten Systemen aus ihrer Zeit bei einem Fintech-Startup mit. Sie stellte kluge Fragen zur API-Versionierung von Stripe. Empfehlung: weiter zur technischen Interviewrunde. Sie hat konkurrierende Angebote und will sich innerhalb von drei Wochen entscheiden.</p>'
