title: Einstellungsprioritäten im Engineering bei Stripe
noteable_type: company
noteable_key: stripe
custom_fields:
  body: <p>Stripe baut das Team für die Zahlungsinfrastruktur aus und sucht Senior-Entwickler mit Erfahrung in verteilten Systemen. Bevorzugt werden Kandidaten, die im großen Maßstab gearbeitet haben und sich mit Finanzsystemen auskennen. Der Zeitplan ist straff. Die Person soll innerhalb von 6 Wochen eingearbeitet sein.</p>
