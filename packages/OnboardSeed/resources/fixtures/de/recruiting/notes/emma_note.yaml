title: Führungserfahrung von Emma Thompson
noteable_type: people
noteable_key: emma
custom_fields:
  body: <p>Emma hat in zwei früheren Positionen Engineering-Teams mit bis zu 25 Personen geleitet. Bei ihrem letzten Unternehmen führte sie die Migration vom Monolithen zu Microservices an und vergrößerte das Plattform-Team in 18 Monaten von 4 auf 12 Entwickler. Ihr Führungsstil setzt auf Eigenverantwortung und klare technische Richtung. Erwartet werden starke Referenzen von direkt Unterstellten und von Kollegen.</p>
