title: Anforderungen an die Kultur bei Vercel
noteable_type: company
noteable_key: vercel
custom_fields:
  body: <p>Vercel legt bei Engineering-Management-Rollen großen Wert auf kulturelle Passung. Gesucht werden Führungskräfte, die tief technisch sind und zugleich stark kommunizieren. Die Hiring Managerin betonte, dass Kandidaten Erfahrung mit Remote-first-Teams und Engagement in der Open-Source-Community nachweisen sollen. Erfahrung im Skalieren von Frontend-Infrastruktur-Teams ist ein klarer Pluspunkt.</p>
